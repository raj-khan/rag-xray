name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. go run ./lessons/04-ask "..."
        2. ...
    validations:
      required: true
  - type: input
    id: providers
    attributes:
      label: Providers and models
      placeholder: "EMBED: ollama/nomic-embed-text, CHAT: anthropic/claude-haiku-4-5"
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Go version or Docker, commit/version"
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      render: shell
